<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGA Newsletter</title>
  <!--
    GitHub Pages serves this for any address under the site that has no
    file - e.g. …/bga-newsletter/news/new. It forwards to the same page of
    the platform, so links people saved or shared keep working. The address
    must match the one in index.html (`npm test` checks).
  -->
  <meta name="bga-app-url" content="">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: #0a1c45; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { width: 420px; max-width: 100%; background: #fff; color: #3a4258; border-radius: 16px; border-top: 6px solid #d8232a;
      padding: 30px; text-align: center; }
    h1 { margin: 0 0 10px; color: #12306b; letter-spacing: 3px; font-size: 22px; }
    a { color: #12306b; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <h1>BGA NEWSLETTER</h1>
    <p data-msg>Opening the platform&hellip;</p>
    <p><a data-home href="/bga-newsletter/">Go to the start page</a></p>
  </main>
  <script>
    (function () {
      var app = (document.querySelector('meta[name="bga-app-url"]').content || '').trim().replace(/\/+$/, '');
      // Project sites live under /<repo>/; drop that prefix to get the
      // platform path. On a custom domain there is no prefix.
      var parts = location.pathname.split('/');
      var base = parts[1] === 'bga-newsletter' ? '/bga-newsletter' : '';
      document.querySelector('[data-home]').href = base + '/';
      if (!app) {
        document.querySelector('[data-msg]').textContent = "This page doesn't exist.";
        return;
      }
      var rest = location.pathname.slice(base.length) || '/';
      location.replace(app + rest + location.search + location.hash);
    })();
  </script>
</body>
</html>
